# darknessRender configuration
# Copy this file to ./darknessRender.yaml in your working directory.
# CLI surface is intentionally minimal — every tunable lives here.
# CLI flags --res and --schemas override paths.* below for one-off runs.

# ── paths ──
# Optional. Set these once and you can launch with just a mission file.
# CLI --res / --schemas override these for one-off runs.
paths:
  res: ""        # Thief 2 RES directory (fam.crf, obj.crf, snd.crf). e.g.
                 #   /Volumes/THIEF2_INSTALL_C/THIEF2/RES
  schemas: ""    # Schema directory (.sch / .spc / .arc). e.g.
                 #   /Volumes/THIEF2_CD2/EDITOR/SCHEMA
                 # If empty, AudioService searches <res>/../EDITOR/SCHEMA.

graphics:
  # Texture filter mode (default: point)
  # point        = crispy, authentic Dark Engine look
  # bilinear     = soft GPU bilinear
  # trilinear    = bilinear with mip blending
  # anisotropic  = 16x AF for grazing-angle surfaces
  texture_filter: point

  # Lightmap filter mode (default: bilinear)
  # bilinear = GPU hardware filtering (fast, matches original engine)
  # bicubic  = cubic B-spline shader (smoother, minimal GPU cost)
  lightmap_filter: bilinear

  # Gamma-correct mipmap generation (default: false)
  # Linearizes sRGB textures before downsampling for correct blending
  linear_mips: false

  # Sharpen mip levels to preserve detail at distance (default: false)
  sharp_mips: false

  # ── Lightmap scale ("2X modulate") ──
  # Multiplier on the baked lightmap in the world shaders:
  #   final = texture * lightmap * lightmap_scale
  #
  # 1.0 IS THE CORRECT VALUE, and the decisive reason is internal rather
  # than historical. Three passes draw into the same target, and only one of
  # them disagreed about what "fully lit" means:
  #
  #   world geometry   texture * lightmap * scale     -> 2.0 at scale 2
  #   objects          texture * min(light, 1.0)      -> 1.0  (clamped)
  #   sky              texture * sky_overbright       -> 1.0  (default 1)
  #
  # At scale 2 a wall reached twice the brightness of a crate leaning against
  # it under the same torch, and the sky sat a full stop below both. Setting
  # 1.0 is what puts them on one reference.
  #
  # It also matches the format. NewDark's docs (new_config_vars.txt,
  # enable_32bit_lightmaps) say that with regular 16-bit lightmaps "the
  # maximum brightness a surface can achieve is that the texture is seen
  # fullbright"; overbrightening is the separate 32-bit 2X modulate mode,
  # which is carried in a WREXT worldrep we cannot yet read (see WR-1).
  # openDarkEngine likewise uses a plain MODULATE. And the shipped data
  # reaches its full 248/255 ceiling, so 2.0 really was a doubling rather
  # than a normalisation.
  #
  # BRIGHTNESS BELONGS IN post_process.exposure, which multiplies the whole
  # composite and so lifts all three passes together. Exposure is applied
  # before the tone curve, so scale 1 + exposure 2 feeds the curve exactly
  # the same signal as scale 2 + exposure 1 — the world looks identical and
  # objects and sky come up to meet it instead of being left behind.
  #
  # 2.0 is what 32-bit 2X lightmaps actually want, and will become a
  # per-mission value derived from LM_PARAM once WREXT lands.
  lightmap_scale: 1.0

  # Honour the tweq update-rate visibility gates (default: true).
  # 184 of the 456 tweq configs shipped with the game run only while their
  # object is on screen, and 9 only while it is off. True reproduces that.
  # Turn it off if the gating ever reads worse than it simulates — a part
  # caught mid-motion as it comes into view.
  # This is a look-versus-fidelity dial, NOT a performance one: the whole
  # tweq step measures 0.054 ms/frame on the heaviest shipped level.
  tweq_visibility_gating: true


  # ── Internal render resolution / vintage mode ──
  # The scene renders at this size and the composite scales it to the window.
  #
  # Below native with a point filter this is the low-resolution pixelated
  # look — Return of the Obra Dinn, No One Lives Under the Lighthouse. The
  # point filter is the whole effect: the same low resolution upscaled with
  # `linear` just looks like a blurry frame.
  #
  # Deliberately NOT a supersampling knob above native. Supersampling
  # multiplies every per-pixel cost, and the deferred G-buffer lighting, SSAO
  # and volumetric scattering on the roadmap are all resolution-proportional
  # — see .claude/PLAN.VISUALS.md "Anti-aliasing" for the measurements. Use
  # SMAA/TAA for antialiasing instead.
  #
  # Needs post_process.enabled — the offscreen target is what the scene
  # renders small into. With post-processing off it falls back to native, and
  # tracks the console toggle live.
  #
  # Startup-only: the scene target and every scene view rect size off it.
  render_scale:
    # Internal render HEIGHT in pixels; width follows the window's aspect.
    # 0 = native. Classic vintage values: 240 (PS1 era), 360, 480 (early PC).
    height: 0

    # point  — chunky uniform pixels; what makes the vintage look read
    # linear — smooth
    filter: point

    # Snap the internal size so the upscale is a whole-number ratio. Without
    # it, point upscaling makes some pixels wider than others and the grid
    # visibly breaks up. At 1280x720 asking for 240 gives an exact 3x
    # (426x240); the 2px horizontal remainder is stretched, which is 0.16%
    # and invisible.
    integer: true

  # ── Antialiasing ──
  # Runs on the composite's output — the final image, after tone mapping and
  # colour correction — because that is the image whose edges you see.
  antialiasing:
    # none | smaa
    #
    # smaa = SMAA 1x, the reference implementation at its Ultra quality
    # preset. Three fullscreen passes: detect edges, look each edge's shape up
    # in a precomputed coverage table, blend. Roughly 0.2-0.4 ms at 1080p, and
    # FIXED — it does not scale with the lighting budget, which is why it is
    # the antialiasing this engine can afford. MSAA was removed and
    # supersampling deliberately not offered; see .claude/PLAN.VISUALS.md.
    #
    # Two requirements, both of which announce themselves if unmet:
    #   * needs post_process.enabled — SMAA resolves the composite's output
    #   * mutually exclusive with a below-native render_scale, which it would
    #     smooth away
    #
    # Startup-only in one direction: the targets and the 180 KB lookup table
    # are allocated only when this is `smaa` at launch. It can then be toggled
    # live from the console (aa_mode), but a session that started with `none`
    # cannot turn it on.
    mode: none

    # Edge-detection threshold. Lower finds more edges: more antialiasing,
    # more work in the weight pass. The reference's presets are 0.05 (Ultra),
    # 0.1 (Medium/High, and its documented default) and 0.15 (Low).
    # Live-editable as smaa_threshold; `aa_debug edges` shows what it finds.
    smaa_threshold: 0.1

  # Sky glow / sky overbright
  sky_glow:
    # Sun/moon glow disc from the mission's SKYOBJVAR glow_* fields.
    # Note: of the 15 retail T2 missions, only MISS1 authors a glow, and
    # it is a wide dim horizon wash rather than a moon. (default: true)
    enabled: true

    # Multiplies the mission's authored glow_scale (default: 1.0)
    intensity: 1.0

    # Sky brightness multiplier (default: 1.0 = untouched).
    # The knob that makes the MOON bloom: the moon is painted into the
    # skybox texture and caps at 1.0, so it needs lifting past unity to
    # register with bloom. Proportional, so dark sky stays dark.
    # Try 1.3-1.8; beyond ~2 the sky looks lifted.
    sky_overbright: 1.0

  # ── Light coronas ──
  # The glare billboard drawn at a light source. Two sources feed one
  # renderer:
  #
  #   AUTHORED   — the mission's own P$Corona records. An original Thief 2
  #                property. Retail authors exactly ONE functional corona in
  #                the whole campaign (MISS5), though NewDark-era fan
  #                missions use them far more.
  #   SYNTHESIZED — a corona on every visible light-emitting object, built
  #                from that one retail record's shape and scaled by each
  #                light's own brightness. The original engine drew no such
  #                glow; this is an enhancement.
  #
  # Coronas are drawn additively with depth testing OFF and occlusion decided
  # by a ray to the light — the engine's construction, and the only one that
  # looks right, since a depth-tested billboard would be sliced by the wall
  # its lamp is mounted on.
  coronas:
    # Master switch, both sources. (default: true)
    enabled: true

    # The enhancement, on its own switch. Set false for strictly the coronas
    # the mission authored. Read once at load — not live-editable. (default: true)
    synthesized: true

    # Multiplies each corona's authored alpha. Past ~1 the glow crosses into
    # the overbright range, which is what makes it bloom. (default: 1.0)
    intensity: 1.0

    # Multiplies both corona radii. (default: 1.0)
    size_scale: 1.0

    # Multiplies each corona's own max visible distance. (default: 1.0)
    max_distance_scale: 1.0

    # How the drawn radius responds to viewer distance. Changes size only —
    # max_distance still bounds visibility either way.
    #
    #   engine    the ORIGINAL Thief 2 rule: grow from "radius up close" to
    #             "radius at max dist" across the light's range. Retail's own
    #             2.0 -> 65.0 over 300 works out to a CONSTANT apparent size,
    #             a ~24 degree disc (40% of screen height) at any distance.
    #             Authentic; retail draws exactly one such corona, in MISS5.
    #   physical  constant world radius, so the glare shrinks on screen exactly
    #             as its lamp does. This is what a veiling-glare disc really
    #             does: with L = k*E/theta^2 and E = I/d^2, the threshold-
    #             crossing radius works out to sqrt(k*I/T) — no distance term.
    #             Both reference engines size billboards this way (HPL2's
    #             cBillboard, Godot's default). Do NOT pair this with a
    #             distance dimming term: a fixed-world-size disc already loses
    #             flux as 1/d^2 through its shrinking solid angle.
    #
    # Synthesizing a glow on every lamp is our enhancement, and at 100 units
    # the engine rule draws it 11x larger than physics wants; at 300 units,
    # 32x. `physical` is the default for that reason. Set `engine` for
    # original-fidelity output, or when running fan missions whose authors
    # tuned both radii deliberately. (default: physical)
    distance_model: physical

    # `physical` only, and IGNORED under `engine`. World units, not a
    # multiplier.
    #
    # The physics fixes the SHAPE of the law — radius independent of distance,
    # proportional to sqrt(intensity) — but its constant is sqrt(k*I/T), where
    # T is the eye's adaptation threshold. Something has to set that, and this
    # is it: the corona is sized as it would have looked from this far away,
    # and then holds that world size at every range.
    #
    # 20 is about a room's width in this game's scale, so the default reads as
    # "the size it looked from across the room". Raise it if coronas seem too
    # small overall, lower it if they dominate. Above 48 nothing changes — the
    # size curve has already clamped. (default: 20.0)
    physical_reference_distance: 20.0

    # Occlusion crossfade time constant, seconds. 0 snaps, which is what the
    # original engine did; the default softens the pop. (default: 0.15)
    fade_seconds: 0.15

    # Per-pixel depth fade: attenuate a corona where scene geometry stands
    # in FRONT of it, so the glow stops painting over a wall nearer than its
    # lamp. This is the "proximity fade" / soft-particle construction —
    # Godot exposes the same thing as StandardMaterial3D.proximity_fade.
    #
    # It answers a different question from the ray trace below: the trace
    # asks "is the light source visible", the fade asks "is THIS PIXEL of the
    # disc covered". Both are wanted, and they compose.
    #
    # REQUIRES post_process.enabled — it reads the scene depth buffer. That
    # buffer is readable because this engine has no MSAA: bgfx refuses to
    # resolve a multisampled depth attachment on any backend, which is one of
    # the two reasons MSAA was removed (see .claude/PLAN.VISUALS.md).
    # The renderer says which occluder is actually running at startup
    # ("Coronas: depth fade ACTIVE / off").
    # (default: true)
    depth_fade: true

    # How far in front of a corona an occluder must be to hide it completely,
    # in world units. Small = crisp silhouette; larger lets the glow bleed
    # softly around an edge, which is what real glare does. (default: 1.5)
    depth_fade_range: 1.5

    # Pull the billboard this far toward the viewer before drawing, so it
    # clears its own lamp's geometry instead of fading against it — the
    # emitter's model writes depth at almost exactly the corona's distance.
    # HPL2's cBillboard carries the same knob as mfForwardOffset.
    # (default: 0.5)
    depth_fade_offset: 0.5

    # Occlude coronas by objects — doors, crates, characters — as well as
    # terrain. The original engine traced terrain ONLY, which is why its
    # coronas shine through closed doors and paint over characters; NewDark
    # added the same switch as `enhanced_corona_trace`. Set false to
    # reproduce the original behaviour. (default: true)
    trace_objects: true

    # Rays per visibility test. 1 = centre only, so a corona clipping a
    # doorframe pops; more samples spread over the disc so it fades.
    # (default: 5)
    trace_samples: 5

    # Coronas re-traced per frame; the rest hold their previous answer. Bounds
    # raycast cost on light-heavy levels without freezing the fade.
    # 0 = no budget, trace everything every frame. (default: 32)
    trace_budget: 32

  # ── Post-processing ──
  # Routes the scene through a floating-point (RGBA16F) target before
  # resolving to the display, then applies tone mapping and colour
  # correction in one fullscreen pass.
  #
  # Why the HDR target matters: the lightmapped world shader computes
  # diffuse * lightmap * 2.0 — the Dark Engine's overbright convention.
  # Drawing straight to an 8-bit backbuffer clamps everything above 1.0
  # flat. The float target keeps that headroom so tone mapping has real
  # highlight range to roll off.
  #
  # Every default below is the identity transform: `enabled: true` with
  # `tonemap: none` is bit-identical to `enabled: false`. All values are
  # live-editable in the debug console (backtick), "Post-processing" group.
  post_process:
    # Master toggle (default: false — original-fidelity output)
    enabled: false

    # Tone-mapping operator (default: none)
    #   none       = clamp only; identical to the pre-post-process image
    #   reinhard   = c / (1 + c); simple, desaturates highlights
    #   aces       = filmic curve with a proper highlight shoulder. A 2015
    #                curve fit: it lifts middle grey (0.18 -> 0.267) and
    #                pushes warm highlights toward yellow-white.
    #   agx        = Blender/Godot's AgX. The best structural fit here: its
    #                white point is 2.0 and so is our signal ceiling (the
    #                lightmap 2x overbright convention), so 0.18 maps to
    #                0.18 exactly and 2.0 to 1.0 exactly. Gentler, more
    #                saturated highlight rolloff — a torch stays orange
    #                instead of going white.
    #   pbrneutral = Khronos PBR Neutral (2024). Preserves hue and albedo
    #                rather than being filmic. Its black-point offset is
    #                unconditional, so mid greys come out 0.04 darker; on
    #                already-dark Thief content that reads as deeper blacks.
    #   lottes     = Timothy Lottes (GDC 2016), midIn/midOut pinned to 0.18.
    #                AgX's midtone behaviour with a much softer rolloff at
    #                BOTH ends, which is the thing AgX does not give. Measured
    #                against agx: shoulder 1.36 vs 0.76 of scene range (1.8x
    #                longer), toe gradient 0.986 vs 1.013 (compressing rather
    #                than linear), and 2.0 lands at 0.915 instead of clipping
    #                to white — the reserve is what keeps a flame coloured.
    tonemap: none

    # [agx] Curve contrast (0.6-2.0, default 1.25 = Godot's).
    # Lower LIFTS the shadows and SHORTENS the shoulder; higher deepens and
    # lengthens both. Middle grey stays at 0.18 either way.
    agx_contrast: 1.25

    # [lottes] Curve shape. Middle grey is pinned at 0.18 regardless of these.
    lottes_contrast: 1.30    # 0.6-3.0
    lottes_shoulder: 0.977   # 0.7-1.0; LOWER = longer, softer highlight rolloff
    # Scene value that maps to display white; everything above it clips. Not a
    # free knob — the curve constants are solved so f(white) == 1.0 exactly.
    # 3.0 leaves the engine's own 2.0 ceiling at 0.915.
    lottes_white: 3.0

    # Linear multiplier applied before tone mapping (0.0-8.0, default: 1.0)
    exposure: 1.0

    # Colour correction, applied after tone mapping. Names, order and
    # defaults follow NewDark's software colour-correction vars.
    brightness: 0.0    # additive offset (-1.0-1.0, default: 0.0)
    contrast:   1.0    # about the 0.5 pivot (0.0-4.0, default: 1.0)
    saturation: 1.0    # 0 = greyscale (0.0-4.0, default: 1.0)
    gamma:      1.0    # applied last (0.1-4.0, default: 1.0)

    # RGB colour filter [r, g, b], each 0.0-1.0 (default: [1, 1, 1])
    # Sepia, for example: saturation 0.25 with rgb_filter [1.0, 0.7, 0.3]
    rgb_filter: [1.0, 1.0, 1.0]

    # Luminance weighting - "what counts as bright". Drives both the
    # saturation pivot and the bloom intensity term. (default: crt)
    #   crt = (0.30, 0.58, 0.12), Rec.601-era. The colour intent Thief 2's
    #         textures were authored against in 1999.
    #   lcd = (0.2126, 0.7152, 0.0722), Rec.709 - how a modern display
    #         actually behaves. Weights green harder.
    luma_mode: crt

    # Bloom. Construction follows HPL2 (Amnesia: The Dark Descent):
    # quarter-res ping-pong blur buffers, N iterations of separable H+V
    # Gaussian, and a combine with NO bright-pass threshold - the blur is
    # weighted by its own luminance, so response is quadratic in brightness.
    #
    # Two deliberate divergences from HPL2: float buffers rather than 8-bit,
    # and bloom added BEFORE tone mapping rather than last, so glows are
    # exposed and rolled off with the rest of the image.
    bloom:
      enabled: false     # (default: false)

      # Which engine's bloom construction: amnesia | newdark (default: amnesia)
      #   amnesia = HPL2. No threshold; blur weighted by its own luminance,
      #             so glow fades in continuously. Soft and diffuse.
      #   newdark = NewDark 1.28. Hard threshold, then desaturate and scale
      #             hard. Only the brightest surfaces glow, but strongly.
      # iterations and blur_size are SHARED (the blur kernel); intensity is
      # amnesia-only; threshold/prescale/scale/saturation are newdark-only.
      style: amnesia

      iterations: 2      # [both] H+V passes, 1-4 (HPL2 ships 2). Radius
                         #        comes from here, not from a wider step.
      blur_size: 1.0     # [both] blur radius multiplier (HPL2 ships 1.0 =
                         #        the kernel's designed tap spacing; above
                         #        ~1.3 it aliases and is converted into
                         #        extra iterations instead)
      intensity: 1.0     # [amnesia] scales the luminance vector (HPL2 ships 1.0)

      # [newdark] NewDark 1.28's own documented defaults
      threshold:  0.6    # min channel value to be included in bloom (0-1)
      prescale:   1.0    # intensity multiplier applied BEFORE blurring
      scale:      5.0    # intensity multiplier applied AFTER blurring
      saturation: 0.7    # saturation of the glow itself (0 = greyscale)

      # [both] Glow radius as a percentage of the screen DIAGONAL - this is
      # NewDark's bloom_range, and NewDark's own default is 2 (~29px at
      # 1280x720). Live-editable as `bloom_range`.
      #
      # 0 DISABLES THE PYRAMID and is the default here. The chain then runs
      # on iterations/blur_size alone, which is HPL2's actual construction.
      #
      # Above 0 the glow is widened by a progressive-downsample pyramid:
      # each level halves resolution, so the radius comes from pyramid DEPTH
      # rather than from a wider blur step. That distinction is the whole
      # point - the 5-tap kernel is only a Gaussian at its designed tap
      # spacing, so a bigger step does not widen the blur, it turns it into
      # a sparse comb that aliases and reads as grain. Halving resolution
      # doubles the reach while every filter stays at ~1 texel.
      #
      # Radius changes WIDTH only; the per-level contributions are scaled so
      # that adding levels does not also brighten the glow.
      range: 0.0

    # ── Film response ──
    # Runs between the tone curve and the colour-correction chain above.
    # Two things a single global `saturation` cannot express:
    #
    #   1. desaturate the GLOOM while leaving bright warm sources alone
    #   2. split tone — tint the two ends of the range differently
    #
    # Why it exists: measured over all 1,700 Thief 2 world textures, the art
    # is 66.8% warm by pixel at 0.412 mean saturation. Global desaturation
    # dulls the torches along with everything else; none at all leaves the
    # world reading brown. The distinction is the whole effect.
    #
    # `strength` is the master dial and 0 is an EXACT no-op, so the whole
    # stage ships off. Everything under it describes the look that strength
    # scales toward — set the look once, then ride strength.
    film:
      # 0.0-1.0. Start low; 0.3-0.5 is a shroud, 1.0 is a statement.
      strength: 0.0

      # Saturation kept at each end (0.0-2.0). The shadow figure does the
      # work: it greys the gloom without touching fire.
      shadow_saturation: 0.55
      highlight_saturation: 1.0

      # Multiplicative split tone, [r, g, b], each 0.0-1.0. Multiplicative so
      # neither end can ADD light — a tint that brightens would undo the
      # gloom the stage exists to create.
      #
      # SHADOW TINT IS NEUTRAL BY DEFAULT AND SHOULD MOSTLY STAY THERE.
      # Cool shadows are the obvious move and are wrong past a very small
      # amount: visibly blue shadows read as a filter over the world rather
      # than as darkness in it. Real gloom is inky and achromatic, and the
      # original engine agrees — across all 32 retail missions of Thief 1 and
      # 2 the authored ambient is never tinted, and Thief 1 has no field with
      # which to. Shadows here get DESATURATED, not coloured.
      # If you want a whisper of it, [0.97, 0.98, 1.00] is about the limit.
      shadow_tint: [1.0, 1.0, 1.0]

      # Highlights warm, because the light sources in this game are fire.
      # Restrained on purpose — the target is a warm SOURCE in a neutral
      # world, not a sepia frame.
      highlight_tint: [1.0, 0.98, 0.94]

      # How tightly each tint is confined to its own end of the range
      # (0.25-6.0). Higher leaves more of the midtones untouched.
      tone_falloff: 1.5

    # ── Halation (the CineStill effect) ──
    # CineStill 800T is Kodak Vision3 with the remjet anti-halation backing
    # stripped off: light bright enough to punch through the emulsion
    # reflects off the film base and re-exposes it from behind. Because long
    # wavelengths penetrate deepest, the halo is red-orange.
    #
    # Two properties define it, and both are why this has its OWN chain
    # rather than borrowing the bloom texture:
    #
    #   THRESHOLDED HARD — only genuinely intense sources halate. A dim lamp
    #     does not. (Borrowing bloom inherited the amnesia style's lack of a
    #     bright pass, so everything glowed slightly red.)
    #   LOCAL — a halo hugging the source, not a screen-scale wash.
    #     (Borrowing bloom inherited bloom.range, which at 2% is a ~27px
    #     spread — about twice what this wants.)
    #
    # Same recipe as the digital-photography version: isolate the
    # highlights, tint them, blur SMALL, add back. Independent of bloom.
    halation:
      strength: 0.0            # 0.0-4.0
      tint: [1.0, 0.32, 0.12]  # red-orange, each 0.0-1.0

      # Value a pixel must exceed, AFTER EXPOSURE, to halate at all.
      #
      # MEASURED, and the first value shipped here was wrong. It was set to
      # 1.0 on the reasoning that lit geometry "reaches 2.0" under the
      # lightmap overbright convention — but that is the CEILING, not the
      # distribution. fs_lightmapped computes albedo * light * 2.0, the atlas
      # clamps light to 1.0, and the real static lightmaps across five retail
      # missions have a MEDIAN of 0.03-0.09 and a p99 of 0.47-0.85. Only
      # 0.9-3.8% of texels exceed 0.50, which is what a pure WHITE texture
      # would need to reach 1.0 at all. So 1.0 sat above the entire frame and
      # halation silently did nothing. The renderer now prints the real
      # distribution per mission at load ("Lightmaps: ...").
      #
      # 0.6 catches roughly the brightest one percent — the top of the
      # lighting range plus coronas and anything emissive. Lower it and
      # ordinary lit stone starts to bleed, which is the wash this was
      # rebuilt to stop being.
      #
      # Compared post-exposure so the number keeps meaning the same thing
      # when exposure moves: exposure is part of how brightly the negative
      # was exposed, and halation happens at the negative.
      threshold: 0.6           # 0.0-4.0; useful band is roughly 0.4-0.9

      # Halo radius in OUTPUT PIXELS. Converted to blur iterations at quarter
      # resolution, where one pass is ~6.5 px of sigma, so the reachable span
      # is about 6.5-13 px and anything beyond says so rather than silently
      # under-delivering. Deliberately tight — for a wide warm spread use
      # bloom's own range with a warm tint; that is a different effect.
      radius: 10.0             # 1.0-16.0

    # ── Grain ──
    # Additive film grain, applied as the LAST pass — after antialiasing and
    # at output resolution (NOTES.FILM_GRAIN.md §9.1).
    #
    # The amplitude is a PRODUCT of two separate physical mechanisms, applied
    # PER CHANNEL (each emulsion layer is separately sensitised and grains
    # independently, so amplitude follows each channel's own density):
    #
    #   sqrt(V(u))       emulsion granularity, from the filtered Boolean model
    #                    of silver-halide coverage. Vanishes at BOTH ends —
    #                    at pure black nothing developed, at pure white
    #                    everything did, and neither can fluctuate — and
    #                    peaks at u = 0.436.
    #   pow(1-u, push)   process emphasis. Pushed film carries more grain in
    #                    the shadows; that is development, not coverage.
    #
    # The noise itself is generated per pixel — hashed white noise on a
    # lattice, Gaussian-weighted over 3x3 with the sub-cell phase included.
    # White noise filtered by kernel h has correlation (h*h)/sum(h^2), which
    # for a Gaussian h of std s is exactly exp(-d^2/4s^2) — the form the model
    # predicts. Deliberately NOT a stored tile: any tile smaller than the
    # screen repeats, and offsetting it per frame slides that repeat across
    # the image.
    grain:
      # PHYSICAL amplitude, 0.0-0.3333. The ceiling is the model's own
      # validity condition (sigma >= 3*mu_r, which in these units is
      # strength <= 1/3) and matches report §4.4's sigma_n <= 0.076. For a
      # stronger look use `gain` below rather than pushing this.
      strength: 0.0

      # NON-PHYSICAL multiplier, 0.0-4.0. Deliberately separate so that
      # stylisation cannot be mistaken for the model.
      gain: 1.0

      # Grain size in REFERENCE-1080p PIXELS, 0.25-8.0 — not output pixels.
      # It is scaled by outputHeight/1080 so grain occupies a fixed fraction
      # of the frame at any resolution (§9.4), which is what a fixed physical
      # grain size on the negative actually does.
      size: 1.5

      # Process emphasis exponent, 0.0-6.0.
      #   0   normally-processed stock: the physical curve alone, peak u=0.44
      #   1   peak u=0.23 — shadow-weighted, the default
      #   2+  progressively deeper into the shadows
      # Zero at pure white for any value.
      push: 1.0

water:
  # Vertex wave displacement amplitude in world units (default: 0.3)
  # 0 = perfectly flat water, higher = more dramatic waves
  wave_amplitude: 0.3

  # UV texture distortion strength (default: 0.015)
  # 0 = no ripple, higher = more wobbly texture
  uv_distortion: 0.015

  # UV rotation speed in radians/sec (default: 0.015)
  # 0 = no rotation, creates slow swirling water motion
  rotation_speed: 0.015

  # UV scroll speed in world units/sec (default: 0.05)
  # 0 = no drift, creates directional water flow
  scroll_speed: 0.05

physics:
  # Physics timestep rate (default: 60)
  # Controls the fixed timestep for player physics simulation.
  # Accepts string names or integer Hz values:
  #   "vintage" or 12 = 12.5Hz (original Dark Engine rate, 3 collision iterations)
  #   "modern" or 60  = 60Hz (default, smooth modern physics, 1 collision iteration)
  #   "ultra" or 120  = 120Hz (high fidelity, 1 collision iteration)
  # Higher rates give smoother collision but cost more CPU.
  # All rates produce equivalent physics behavior (same walk speed, jump height,
  # head bob timing).
  # Toggle at runtime via debug console (backtick key).
  # CLI: --physics-rate <12|60|120>
  rate: 60

developer:
  # Render object meshes (default: true)
  # Set to false for world-geometry-only view
  show_objects: true

  # Show colored fallback cubes for objects with missing models (default: false)
  # Enable for debugging which objects lack .bin models in obj.crf
  show_fallback_cubes: false

  # Portal/frustum culling (default: true)
  # Toggle at runtime in the debug console (`portal_culling`)
  portal_culling: true

  # Camera collision with world geometry (default: false)
  # Toggle at runtime in the debug console (`camera_collision`)
  camera_collision: false

  # Log stair step diagnostics to stderr (default: false)
  # Prints [STEP] messages for debugging stair-step logic
  step_log: false
  # Muted stderr log channels — comma-separated tags. Gated (runtime-
  # recurring) tags: ODE, TWEQ, TWEQ_MODEL, PATH_RAW. Toggle live via
  # console log_ode / log_tweq / log_tweq_model / log_path_raw.
  # [FALLBACK] lines are never muteable.
  log_mute: "ODE"

  # Dump per-object filtering diagnostics to stderr (default: false)
  debug_objects: false

  # Auto-activate all moving terrain at startup (default: false)
  toggle_platforms: false

  # Skip Steam Audio probe baking (default: false)
  # Faster startup but no spatial audio reflections
  no_probes: false

  # Enable audio/sound/schema log output (default: false)
  audio_log: false

  # Record the engine's final stereo output (f32 WAV, post master DSP) to
  # output.wav next to the per-run audio_perf.jsonl (default: false).
  # CLI mirror: --capture-wav. Analyze offline with tools/wav_artifacts.py.
  capture_wav: false


audio:
  # Audio is organized into named subsections. Skip any subsection to use
  # defaults; each setting is independent. Bracketed numbers are valid ranges.

  engine:
    # Device-callback / mixer-thread topology (immutable after boot).
    #
    # ring_mixer: true (default) renders the whole mix graph on a dedicated
    # high-priority mixer thread that keeps a lock-free ring buffer topped
    # up; the device callback only copies from the ring (bounded time, so
    # the render can never starve the audio device — the crackle fix).
    # false = legacy pre-ring behavior: the mix graph renders synchronously
    # inside the device callback and competes with the hardware deadline
    # (kept selectable for A/B comparison; expect crackling under load).
    ring_mixer: true
    # Ring fill target in milliseconds. The mixer thread tops the ring up
    # to this much buffered audio each wake; larger = more scheduling slack
    # for the render, but also more output latency (the buffered audio sits
    # between the mix graph and the DAC). <= 0 (default) = auto: two engine
    # blocks (2 x frame_size / sample_rate), floored at 21.4 ms so total
    # output slack stays at or above the pre-ring-mixer device-buffer
    # slack. Watch `[PERF device_cb] ring low_wm=` before trimming: the low
    # watermark is how close the device came to draining the ring. (0=auto-500)
    ring_margin_ms: -1

  performance:
    # Engine + reverb throughput. Touch these to trade CPU for fidelity.
    #
    # Scope tags annotate which pipeline branch each setting affects:
    #   [GLOBAL]      audio engine / hardware
    #   [DIRECT]      direct path only (no reflections)
    #   [REALTIME]    realtime ray-traced reflections only
    #   [BAKE]        offline probe bake only
    #   [REFLECTIONS] both realtime + baked-probe reflection convolution

    # ── audio device (immutable after boot) ──
    sample_rate: 48000           # [GLOBAL] device sample rate (22050|32000|44100|48000|96000)
    frame_size: 512              # [GLOBAL] audio engine block size (256–4096); callback period = frame_size / sample_rate. 512 chosen for low total output latency (~32 ms with periods=2); halves the async convolution pipeline gap vs 1024.  [default: 1024]
    sound_cache_mb: 64           # [GLOBAL] decoded-audio LRU cache budget (4–1024 MB)

    # ── voice budgets ──
    max_active_voices: 64        # [GLOBAL] hard cap on simultaneous voices (8–256)
    # [REFLECTIONS] Cap on total reverb voices (realtime + baked combined).
    # Every reverb voice runs a per-source convolution regardless of mode,
    # so this is the worker-pool CPU governor. 0 disables reverb entirely
    # (fully dry). Direct-sim source pool is auto-derived from
    # max_active_voices; reflection-sim source pool from this cap.
    reverb_voices: 8             # (0–64)  [default: 16]
    # [REALTIME] Of the reverb voices above, how many may run with realtime
    # ray-traced IRs. 0 = baked-only (recommended for now — see
    # NOTES.AUDIO_CONFIG_AUDIT.md Finding 1 about realtime sim cost).
    # Range [0, reverb_voices].
    reverb_voices_realtime: 0

    # ── reverb pipeline cost ──
    # rate_divisor halves CPU per step at the cost of reverb bandwidth.
    # 24 kHz is transparent for most material; 12 kHz dulls the highest
    # harmonics. Reverb tails are dominated by frequencies below 4 kHz.
    rate_divisor: 2              # [REFLECTIONS] 1=48k, 2=24k, 4=12k
    # reflection_throttle = signal the reflection-sim worker every Nth
    # audio loop step. Applies to baked-only mode too — it paces how
    # often the shared baked-reverb source's IR refreshes against the
    # listener position. Higher = less CPU, longer reverb-update latency.
    reflection_throttle: 4       # [REFLECTIONS] (1–32)
    # Steam Audio per-source occlusion sample cap. Used by BOTH the direct
    # and reflection simulators' occlusion solvers.
    sim_max_occlusion_samples: 32  # [DIRECT+REFLECTIONS] (4–256)

    # ── thread budget ──
    # Two explicit integer counts for reverb work.
    #   conv_threads — per-voice convolution workers (USER_INTERACTIVE QoS)
    #   sim_threads  — Steam Audio ray-trace simulator threads (UTILITY QoS)
    # Both 0  = auto: total = max(4, hwconc - 2), split ~35% conv /
    #           ~65% sim in baked-only mode (~45% / ~55% with realtime
    #           voices). The sim is the bottleneck in both modes
    #           (hundreds of ms per cycle); convolution has plenty of
    #           headroom for typical voice counts.
    # Both > 0 = use the literal values (no invariant against hwconc).
    # Mixed (one 0, one > 0) emits a [REVERB_THREADS][FALLBACK] warning
    # and falls back to auto for both — the contract is "set both or
    # neither."
    conv_threads: 0
    sim_threads:  0

    # ── scene backend ──
    # "default" = Steam Audio's built-in CPU raytracer.
    # "embree"  = Embree (faster on large meshes) — requires a Steam Audio
    #             rebuild with Embree linked; falls back to "default" with
    #             a loud [FALLBACK] log if iplSceneCreate refuses.
    scene_type: default          # [REFLECTIONS]

  reflections:
    # Convolution-reverb feel. Drives perceived room size & detail.
    #
    # Bake vs realtime parameters are split into two sub-blocks because the
    # offline bake can afford much higher quality settings than the per-frame
    # realtime simulation. The bake runs once per mission and is cached
    # to disk; realtime runs every `reflection_throttle` audio frames and
    # drives the CPU budget for live sources.
    enabled: true                # [REFLECTIONS] master toggle (R key in console)
    # [REALTIME] ambisonic order: 0=omnidirectional (1ch, cheapest),
    # 1=directional (4ch), 2=(9ch), 3=(16ch). Memory + decode cost scale
    # with (N+1)^2 channels. Bake-side order is `bake.ambisonics_order`
    # below and can be higher than realtime — the runtime decoder downmixes
    # baked higher-order IRs as needed.
    ambisonics_order: 0          # 0–3
    # [REFLECTIONS] effect algorithm — HYBRID-only. The pipeline always runs
    # Steam Audio's `IPL_REFLECTIONEFFECTTYPE_HYBRID`:
    #   • HEAD: full FFT convolution over the first `hybrid_transition_time`
    #     seconds of the IR — preserves discrete early reflections.
    #   • TAIL: parametric (energy-based) reverb beyond the head, driven by
    #     RT60 sourced from `reverbTimes[3]` baked into the probe data
    #     (corresponds to the game's EAX-style reverb presets). Parametric
    #     tails do not beat from per-frame IR crossfade stacking, which is
    #     the failure mode that prompted the migration from CONVOLUTION.
    # The deprecated `type:` key is still parsed but ignored with a
    # [FALLBACK] warning if present in the YAML.

    # [REFLECTIONS] Hybrid head length. Steam Audio's Unity/Unreal reference
    # integrations default to 1.0 s. Applies to BOTH realtime AND baked
    # voices. Steam Audio crashes if hybrid_transition_time > IR duration
    # (realtime.duration / bake.duration), so we enforce a 0.1 s margin.
    hybrid_transition_time: 1.0  # seconds; pure conv 0..(T*(1-O))s, blend T*(1-O)..T s
    hybrid_overlap_percent: 0.25 # fraction of transition_time used for crossfade

    # Realtime simulation params (running every reflection_throttle frames).
    # Phase 4 lowered rays from 4096 and bounces from 8 toward Steam Audio's
    # recommended realtime defaults — the late-tail beauty now lives in the
    # parametric portion, so realtime doesn't need to over-sample.
    realtime:
      rays: 2048                 # rays per realtime sim step (128–8192)  [default: 1024]
      bounces: 4                 # bounces per ray (1–8); biggest CPU lever (each +1 doubles ray-segment work)
      duration: 1.1              # IR duration in seconds (must exceed hybrid_transition_time by 0.1 s margin)
      diffuse_samples: 32        # diffuse scattering samples per bounce (16–256)

    # Offline bake params (run once per mission; cached as .probes files).
    # Phase 5 raised these toward Unity's offline reference values so
    # adjacent probes have significantly less Monte Carlo noise variance.
    # Per-probe bake cost is roughly 32x higher than the old settings;
    # the Phase-8 adaptive probe spacing is what makes the total bake
    # time stay reasonable for shipping levels.
    bake:
      rays: 16384                # rays per bake step (1024–65536)  [default: 4096]
      bounces: 16                # bake bounces (1–64)  [default: 8]
      duration: 1.1              # bake IR duration in seconds (>= realtime.duration; only the first hybrid_transition_time s is convolved, the rest feeds parametric RT60 estimation)
      diffuse_samples: 1024      # bake diffuse samples (32–4096)  [default: 256]
      ambisonics_order: 2        # bake ambisonic order (0–3); may be higher than runtime ambisonics_order — Steam Audio's IPLReflectionEffectParams.numChannels lets the runtime process only the first N channels (per phonon.h: "May be less than the number of channels specified when creating the effect"), so a higher-order bake is read at the runtime cap with no extra work. The unused higher-order channels are dropped at apply time.  [default: 1]

  probes:
    # Baked-probe grid parameters. Probes are points where Steam Audio
    # samples reflection IRs at bake time; the runtime interpolates between
    # the nearest 8 to produce a listener-position-dependent reverb.
    #
    # A halved spacing quadruples probe count and roughly quadruples bake
    # time, but reduces the audible amplitude swings as the listener walks
    # between probes (footsteps in particular). If footstep reverb feels
    # patchy with spacing=5, try 2.5 and re-bake (`bake_probes` in console).
    spacing: 5.0                 # grid spacing in feet (1.0–20.0; re-bake required)
    height: 5.0                  # probe height above floor in feet (0.5–20.0)
    # Extra elevations (feet, above each floor probe) to replicate the
    # floor grid at. Improves Steam Audio pathing for wall-mounted
    # torches and ceiling-mounted lamps, which would otherwise snap to
    # the floor probe directly underneath them. Default [10.0] covers
    # the common case. Set to [] to disable (floor-only). Re-bake
    # required.
    elevations: [10.0]
    # Minimum clearance, in engine feet, between a baked probe and the
    # nearest wall of its containing room. Drops two pathological cases
    # before baking:
    #   - inside-solid candidates (no containing room) → near-zero IR
    #   - wall-adjacent candidates → strong first-bounce reflection
    #     that comb-filters audio at multiples of c/(2·distance)
    # 0 disables the clearance check (inside-solid rejection still runs).
    # Default 5 ≈ 1.5 m, just outside the comb-filter danger zone
    # (~0.5–1 m). Setting above ~half a corridor's width rejects every
    # probe in that corridor — drop to 3 if you see coverage gaps. Re-bake
    # required.
    min_wall_clearance_ft: 5.0   # (0–50; 0 = clearance check off)
    # Elevation-tier sparsity. Floor probes are binned on a coarser
    # (x, y) grid (binSize = spacing × this) and ONE elevation probe is
    # placed at each bin's centroid per tier. 2.0 = 2×2 binning = 1:4
    # ratio of elevation to floor probes; 1.0 = legacy 1:1. With
    # emitter-anchored probes covering wall/ceiling emitters at their
    # actual positions, the elevation tier only needs enough density
    # for vertical sound propagation between levels.
    elevation_sparsity_mul: 2.0  # (1.0–8.0; higher = sparser; re-bake required)
    # Global dedup pass radius (engine feet). After all probe placement
    # (floor + elevation + portal + emitter), probes within this distance
    # of an earlier-kept probe get dropped. Catches cross-pass overlaps.
    # 0 = dedup disabled.
    global_dedup_radius_ft: 2.0  # (0.0–10.0; re-bake required)

  pathing_probes:
    # Steam Audio pathing uses a separate, sparse probe batch
    # (ROOM_PORTAL graph: one probe per room centroid + two probes
    # ±offset across each portal plane). Keeping pathing density low
    # makes `findAlternatePaths` microsecond-fast even when door OBBs
    # invalidate baked paths at runtime; the dense reflection probe
    # grid above is still used for IR sampling.
    #
    # CODE-OWNED (deliberately NOT yaml keys — do not re-add knobs for
    # these; a yaml value could silently disagree with what the cache
    # was baked with):
    #   - pathing bake/runtime visibility test parameters
    #     (SteamAudioPathing.h: kPathingVisThreshold, kPathingVisRadiusFt,
    #     kPathingVisSamplesShip/Dev — ship/dev selected by the
    #     --bake-quality CLI flag, recorded in the .probes v3 header,
    #     mismatches trigger an automatic pathing-only re-bake);
    #   - the bake's single-edge visRange cap (derived per mission from
    #     ROOM_DB room/portal spans — see [PATHING_BAKE_RANGE] in the
    #     bake log; runtime per-voice visRange is clamped to it with a
    #     loud [FALLBACK]). `vis_range_override_ft` below is the one
    #     escape hatch, and it is experimental rather than a tuning knob.
    #
    # Set to false to skip baking the pathing batch entirely. The
    # .probes file then contains only the reflection batch and Steam
    # Audio pathing falls back to the synthetic-bypass branch (no
    # diffraction routing). Requires a re-bake to take effect.
    enabled: true
    # Proximity dedup radius (engine feet) applied after pathing-
    # candidate emission. Drops any candidate within this distance
    # of an earlier-emitted one — catches compound-doorway portal
    # clusters, sub-room centroid overlap, and emitter-near-centroid
    # coincidences. 10 ft is a good default for Thief 2 levels (room
    # sizes 15-30 ft, compound doorways routinely cluster within 5
    # ft). Independent of the reflection batch's
    # global_dedup_radius_ft above. 0 disables the pass. Re-bake
    # required.
    dedup_radius_ft: 10.0  # (0.0–30.0)
    # EXPERIMENTAL A/B lever, not a tuning knob. 0 (default) uses the
    # coverage-derived visRange described in the CODE-OWNED note above;
    # any other value FORCES the bake's single-edge visRange to exactly
    # that, bypassing the derivation and its clamps. It announces itself
    # (`[PATHING_BAKE_RANGE] EXPERIMENTAL OVERRIDE`, printing the derived
    # value alongside for comparison) and is written into the .probes
    # header like the derived value, so runtime clamping follows it
    # automatically rather than disagreeing with the cache.
    # Offline analysis suggests ~80 ft keeps the aperture graph healthy
    # at a fraction of the edges — that sweep is what this exists for.
    # Re-bake required.
    vis_range_override_ft: 0.0  # (0.0–400.0; 0 = coverage-derived)
    # Probe layout density tier. The layout is the original Dark
    # Engine room/portal graph's nodes; density dials realism UP from
    # that baseline at stated cost (bake pairs AND the runtime path
    # solver are ~quadratic in probe count):
    #   baseline — Tier 0: 1 probe per room centroid (+ upper
    #              centroid for rooms taller than 40 ft) + 1 per
    #              non-door portal center + door flanking pairs +
    #              emitter mirrors. Selectable for fast dev bakes /
    #              low-end: wins the medians (MISS2 pathing p50 66 vs
    #              85 ms; dev bake 17.7 vs 28.4 min at ns8) but has
    #              the worse worst case (below).
    #   bends    — Tier 1 (default): baseline, with every non-door
    #              portal's center probe replaced by a flanking pair
    #              (center ± 5 ft along the portal normal) — explicit
    #              solver bend points so sound turning a corner takes
    #              an audible detour around the opening. Costs +1 probe
    #              per non-door portal. Default per user decision
    #              2026-07-12 (fidelity first): measured BETTER
    #              worst-case door spikes — at ns8, worst window
    #              316.8 ms vs baseline's 535-696 ms (baseline's
    #              spikes were hidden by log rate-limiting when the
    #              default briefly flipped on 2026-07-11).
    #   ("high" is RESERVED for a future Tier 2 — room-span subdivision
    #    for long halls — and is rejected until it exists.)
    # Recorded in the .probes header; changing it triggers a loud
    # automatic pathing-only re-bake on the next run.
    density: bends  # (baseline | bends; re-bake on change)

  occlusion:
    # Source occlusion + global material multipliers.
    #
    # `radius` is in engine feet, converted to meters at the Steam Audio
    # boundary. Volumetric occlusion samples N points from a sphere of
    # this radius centered on the SOURCE and casts rays from each to the
    # listener; fraction unoccluded = unoccluded fraction. Tuning notes:
    #   • Too small → many sample points fall INSIDE the source's own
    #     visible mesh (e.g. a street-lamp embedded in its lamp-post
    #     model). Rays from those interior points hit the mesh on their
    #     way out → near-total self-occlusion. Listener hears nothing
    #     until they move/jump above the fixture.
    #   • Too big → rays from the far side can travel through walls
    #     before hitting the listener → falsely-unoccluded for sources
    #     that really are walled off.
    #
    # Rough sizing guide:
    #   5  ≈ candle / point source
    #   10 ≈ lamp / small fixture
    #   16 ≈ doorway / small machinery
    #   20 ≈ machinery / chest-sized solid source
    #   25+≈ ambient drone / industrial vent
    radius: 10.0                 # volumetric source sphere (feet, 0.3–30)  [default: 5.0]
    samples: 16                  # rays per source for occlusion gradient (4–64)
    transmission_scale: 1.0      # material transmission multiplier (0.1–100; 10=game-friendly)
    absorption_scale: 0.75        # material absorption multiplier (0.01–10; <1 = more reflective)  [default: 1.0]

  propagation:
    # BSP-cell-graph + door blocking for AI hearing and through-wall sounds.
    # Phase 1 of PLAN.CELL_GRAPH_PROPAGATION migrated player audio and AI
    # hearing to a single shared propagation algorithm; the per-mission
    # cell graph is built once at level load (~5ms on MISS6) and consulted
    # via a lazy per-source Dijkstra tree cache at runtime.
    portal_routing: true         # route sound through portal graph (doorways)
    probe_pathing: true          # baked probe diffraction (when probes loaded)
    max_distance: 200.0          # max propagation distance (world units, 10–5000)
    door_lpf_open_hz: 20000      # LPF cutoff for fully open door (Hz, 1k–24k)
    door_lpf_blocked_hz: 800     # LPF cutoff for fully blocked door (Hz, 100–10k)
    min_attenuation: 0.0         # propagation floor (0–0.1; floor disabled by default; was 0.001; FP-noise reasoning was speculative — left in place as a config knob in case it needs to be re-enabled)
    # N-path BFS: keep multiple portal-graph routes when a sound can reach
    # the listener through more than one doorway. 1 = single shortest path
    # (single-source behavior); 2 = original Dark Engine (dual-predecessor
    # scheme matching the per-room propagation record + path-merge step); 3-4 = modernized. The
    # multi-path-ambisonics renderer allocates up to 4 sub-source slots
    # per voice (kMaxSubSources in VoicePool.h), so set this to 4 to
    # keep every reachable doorway continuously active and avoid audible
    # loudness jumps when the kept-paths set swaps across listener
    # motion. Lower values pin the slot count and produce the legacy
    # set-swap behavior on cue.
    max_paths: 2                 # simultaneous propagation paths per listener (1–4)
    # An alternate path is kept only if its effective distance is within
    # this many world units of the primary. Filter runs MID-BFS (at
    # intermediate rooms, not only at the listener room), so a tight
    # window kills alternates early and they never reach the listener.
    # The legacy default (10) came from the original engine's
    # kMaxDistDiff and was tuned for a single-source renderer where
    # alternates only modulated a centroid. For the multi-path renderer
    # use 50 (the clamp ceiling) so essentially every distinct-
    # predecessor alternate within the propagation horizon stays
    # active — the per-slot renderer needs the unblocked-doorway path
    # available even when its effDist is notably longer than the
    # primary's wall-edge anchor path.
    max_path_diff: 50.0          # alternate-path distance window (world units, 0–50)  [default: 10.0]
    # Multiplier on the scalar gain produced by Steam Audio's baked pathing
    # eqCoeffs. 1.0 = identity (use baked values as-is). Bump above 1 when
    # cross-room/through-doorway sound feels too dead and a re-bake (with
    # lower visibility threshold / denser probes) is too expensive. Does
    # NOT affect the LPF blocking factor — only amplitude.
    pathing_gain_scale: 1.0      # multiplier on pathing gain (0.1–10.0)
    # Multiplier on the pathing-derived LPF blocking factor — the companion
    # to pathing_gain_scale, for the filter rather than the amplitude.
    # Steam Audio returns very low eqHigh for cross-room voices (~0.02
    # typical), so the plain mapping `blocking = 1 - eqHigh` pegs the door
    # LPF at its floor and makes distant ambients unrecognisably muffled.
    # Lower this to keep the filter more open. Range 0.0-1.0; 1.0 = the
    # unscaled mapping.
    pathing_blocking_scale: 1.0
    # Steam Audio pathing-simulation throttle. The sim runs on the
    # PathingSimulator worker thread; this interval sets how often the
    # worker is signalled. 0.1 s (10 Hz) matches the Unity/Unreal Steam
    # Audio integration defaults — the listener moves <1 ft per update
    # at walking speed, well below the threshold for hearing
    # portalAttenuation/portalBlocking changes. Output reads (eqCoeffs →
    # portal gain/LPF) still happen every frame and use Steam Audio's
    # last-cached values, so audio stays smooth between sim runs. Set
    # to 0.0 to update every frame (legacy / A-B diagnostic).
    pathing_update_interval: 0.05 # min seconds between pathing due ticks (0.0–1.0); event-driven staging means idle ticks are free — this is door-event quantization delay
    # Router-gated search: when the door-aware route graph says a voice is
    # unreachable (no surviving path around fully-closed doors / a
    # disconnected probe island), skip Steam Audio's alternate-path search
    # for it — that search would exhaustively drain the reachable probe
    # graph (the 170-745 ms worst-case pathing solves) only to report the
    # same no-route verdict the volume gate already silences the voice on.
    # Leave true; false exists for A/B measurement only.
    pathing_router_gate: true
    # No-route movement damping: a voice whose last Steam Audio verdict was
    # "no route" re-checks for a route only every (this × 5 ft) of
    # listener/source travel instead of every 5 ft — each premature retry
    # is an exhaustive graph search that finds nothing. Room changes and
    # door openings still trigger discovery immediately. 1 = off (A/B).
    pathing_noroute_move_mul: 4
    pathing_smoothing_ms: 100    # smoothing time constant for pathing EQ/SH between solves, ms (0 = verbatim)
    # Per-band weights for collapsing Steam Audio's 3-band eqCoeffs into
    # the scalar portalAttenuation gain. Applied as
    #   gain = wL·eqLow + wM·eqMid + wH·eqHigh
    # then scaled by pathing_gain_scale. Default {0.25, 0.50, 0.25} is
    # mid-heavy (roughly A-weighted). Weights NOT auto-normalised —
    # sums other than 1.0 produce a flat boost/cut. Each component
    # clamped to [0, 1]. Typical tunings:
    #   [0.25, 0.50, 0.25] default mid-heavy
    #   [0.50, 0.40, 0.10] bass-heavy — fuller cross-room sounds
    #   [0.33, 0.34, 0.33] flat — highs contribute equally
    #   [0.10, 0.40, 0.50] treble-heavy — muffled = quiet
    pathing_gain_band_weights: [0.25, 0.50, 0.25]

  spatialization:
    # Listener-side HRTF + distance attenuation curve.
    hrtf_volume: 1.0             # HRTF output gain (0–4)
    hrtf_interpolation: bilinear # "nearest" or "bilinear" (HRTF dataset interpolation)
    spatial_blend: 1.0           # 0=mono center, 1=full HRTF spatialization

  ambient:
    # P$AmbientHack-driven looping sounds (mission ambients).
    #
    # Voice lifecycle (Group D, 2026-05):
    #   * Spawn: dist < amb.radius (original-engine spawn boundary, no
    #     multiplier).
    #   * Halt:  perceived audibility (mapping.gain ×
    #            directParams.distanceAttenuation × schema_gain_linear)
    #            drops below `halt_audibility_threshold_db` for
    #            `halt_below_threshold_frames` consecutive ticks.
    # `spawn_fade_in_ms` / `halt_fade_out_ms` straight-line ramps hide
    # the discrete state-change pops on either end.
    spawn_fade_in_ms: 150        # volume ramp 0→full on voice spawn (0–2000 ms)
    halt_fade_out_ms: 250        # volume ramp full→0 before halt-stop (0–2000 ms)
    halt_audibility_threshold_db: -50  # dB level below which voice is "inaudible" (-80 to -20)
    halt_below_threshold_frames: 30    # consecutive sub-threshold frames before halt (5–600)
    default_priority: 64         # priority for ambients without explicit value (0–255)
    # Per-voice HRTF spatial-blend override for room-attached ambients
    # (AMB_ENVIRONMENTAL: wind, church reverberance, generic room tone).
    # 1.0 = full HRTF point-source pan (default for everything else);
    # 0.0 = mono passthrough with no directional cue. Lower values make
    # room ambients feel diffuse rather than coming from a single point.
    # Object-attached ambients (no AMB_ENVIRONMENTAL flag) ignore this
    # and keep full HRTF so e.g. a generator hum stays directional.
    environmental_spatial_blend: 0.3  # (0.0–1.0)
    # Global linear multiplier applied to every ambient + spot-ambient
    # voice. Compensates for the ambient-volume re-baseline introduced
    # when Steam Audio became the sole player-audio propagation authority
    # (the per-radius centibel falloff curve is retired). Single tuning
    # knob, default 1.0 = no change. Adjust by ear.
    global_volume_scale: 1.0     # (0.0–4.0)

  mixer:
    # Global gains. Independent direct/indirect knobs let you tune the
    # "around the corner" cue: lower direct_gain or raise reflection_gain
    # to make bounced sounds more prominent vs. line-of-sight sounds.
    #
    # direct_gain + reflection_gain default to 0.5 (paired -6 dB) because
    # [GAIN] logs showed Steam Audio's ambisonics decode pushing the wet
    # bus to +10 dBFS peak — lowering both gains by -6 dB in lockstep
    # gives the master chain ~6 dB of headroom for the EQ shelf and
    # compressor makeup while preserving the wet/dry ratio of the mix
    # (so the soundscape stays equally "spatial" but quieter overall).
    # Use master_gain or compressor settings to claw perceived loudness
    # back if needed.
    master_gain: 1.0             # global output multiplier (0–4)
    direct_gain: 0.5             # dry-bus multiplier — direct path only (0–4)  [default: 1.0]
    reflection_gain: 0.5         # reverb wet bus multiplier — indirect path (0–4)  [default: 1.0]
    reflection_ramp_ms: 10.0     # fade-in time on first reflection activation (1–1000 ms)

  dsp:
    # Master bus DSP chain. Processing order: Low-shelf EQ → Compressor → Limiter
    limiter_enabled: true              # soft tanh limiter (prevents digital clipping)
    limiter_knee: 0.8                  # onset threshold (0.5–0.95)

    compressor_enabled: true           # tames transients
    # Threshold raised from -15 to -12 dB and ratio bumped from 3:1 to 5:1
    # to keep the "oppressive" character on loud transients while engaging
    # less often on the median signal (the 3:1 @ -15 dB setting averaged
    # 6.6% of samples limited in heavy windows — audible gain pumping
    # rather than transient catching).
    compressor_threshold_db: -12.0     # dBFS threshold (-30 to 0)  [default: -15.0]
    compressor_ratio: 5.0              # compression ratio (1.5–10)  [default: 3.0]
    compressor_attack_ms: 10.0         # attack time (1–100 ms)
    compressor_release_ms: 250.0       # release time (50–2000 ms)

    eq_enabled: true                   # low-shelf EQ (adds bass weight)
    eq_freq_hz: 120.0                  # center frequency (60–500 Hz)
    eq_gain_db: 3.0                    # shelf gain (-6 to +6 dB)
    eq_q: 0.707                        # filter Q (0.3–2.0; 0.707 = Butterworth)

    ducking_enabled: false             # duck ambients when SFX plays
    ducking_amount: 0.5                # ambient volume during ducking (0.1–1.0)
    ducking_attack_ms: 50.0            # ducking attack (10–500 ms)
    ducking_release_ms: 500.0          # ducking release (50–5000 ms)

    # Wet-bus tape saturation — applies a soft tanh saturator to the SUMMED
    # reverb bus (post reflGain ramp, before mixing with dry path). Models
    # analog tape / phonograph compression — nearly transparent for quiet
    # reverb, harmonic warmth at moderate levels, brick-wall ceiling at loud
    # peaks. Doubles as a graceful clip-handler for pathological hot probes
    # (e.g. a player inside a small metal container with an interior ambient)
    # without polluting the dry signal.
    #
    # drive  feel                                       peak ceiling
    #   1.0  soft brick-wall only, no audible color     ±1.0
    #   2-3  audible tape-like warmth                   ±0.5..0.33
    #   4-6  vintage phonograph character               ±0.25..0.16
    #   8-10 heavy, almost lo-fi                        ±0.13..0.10
    wet_saturation_enabled: false      # apply tanh saturation to wet bus
    wet_saturation_drive: 1.0          # saturation drive (1.0–10.0)
